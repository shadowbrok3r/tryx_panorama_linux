[package]
name = "tryx_panorama_linux"
version = "0.1.0"
edition = "2024"

[features]
# Default build is CLI-only so it works (and builds fast) on headless machines.
# Build the desktop app with: cargo build --features gui
default = []
gui = [
    "dep:eframe",
    "dep:egui",
    "dep:egui_logger",
    "dep:egui_extras",
    "dep:egui-phosphor",
    "dep:image",
    "dep:rfd",
    "dep:crossbeam",
]

[dependencies]
# `clipboard` became opt-in in eframe 0.37; without it copy/paste in text fields is dead.
eframe = { version = "0.37", features = ["persistence", "serde", "default_fonts", "glow", "x11", "clipboard"], default-features = false, optional = true }
egui_logger = { version = "0.13", optional = true }
egui_extras = { version = "0.37", features = ["default", "image"], optional = true }
# crates.io egui-phosphor 0.14 still targets egui 0.36; this fork's egui-037 branch is the
# one mtech-ui builds against.
egui-phosphor = { git = "https://github.com/shadowbrok3r/egui-phosphor", rev = "7275d267f6a615004784d57bef7f39d619288739", default-features = false, features = ["regular"], optional = true }
# Decodes the panel screenshots behind the GUI's "Now showing" preview (same
# version egui_extras pulls in, which has no PNG decoder enabled by itself).
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"] }
crossbeam = { version = "0.8", optional = true }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }

# default-features = false: skip libudev (needs pkg-config + libudev-dev at build
# time); port enumeration falls back to sysfs, which is all we need.
serialport = { version = "4.9", default-features = false }
md5 = "0.8.0"
rfd = { version = "0.17", optional = true }
chrono = "0.4"
ctrlc = { version = "3", features = ["termination"] }

[dependencies.egui]
version = "0.37"
default-features = false
features = ["rayon", "bytemuck", "serde"]
optional = true

[profile.release]
strip = true
lto = true
debug = false
opt-level = 3
